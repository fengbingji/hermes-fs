<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%">
  <defs>
    <!-- 背景深色工业面板渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1118" />
      <stop offset="50%" stop-color="#101D29" />
      <stop offset="100%" stop-color="#070C12" />
    </linearGradient>

    <!-- 机械主体冷钢蓝渐变 -->
    <linearGradient id="steelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFF" />
      <stop offset="50%" stop-color="#1B5E9E" />
      <stop offset="100%" stop-color="#0E355C" />
    </linearGradient>

    <!-- 亮面金属高光渐变 -->
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EDF8" />
      <stop offset="100%" stop-color="#8FA8C2" />
    </linearGradient>

    <!-- 高分子熔融丝材渐变（热端橙红 -> 冷却成型科技青） -->
    <linearGradient id="filamentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="45%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- 挤出热端模头渐变 -->
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- 柔和工业投影 -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    
  </filter></defs>

  <!-- 1. 背景底板（如需透明底可直接删除此 rect） -->
  <rect width="680" height="200" rx="16" fill="url(#bgGrad)" />

  <!-- 背景精密工业网格装饰线 -->
  <g stroke="#1E3246" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="680" y2="40" stroke-dasharray="4 8" />
    <line x1="0" y1="160" x2="680" y2="160" stroke-dasharray="4 8" />
    <line x1="200" y1="20" x2="200" y2="180" />
  </g>

  <!-- 2. 左侧核心图形徽标 (Icon Mark) -->
  <g filter="url(#dropShadow)" transform="translate(10, 0)">
    <!-- 外层六边形闭环制造护盾 -->
    <polygon points="100,22 168,61 168,139 100,178 32,139 32,61" fill="#0D1824" stroke="url(#steelBlue)" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- 内层精密机械倒角边框 -->
    <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="#2B4C6F" stroke-width="1" stroke-dasharray="18 6" />

    <!-- H字母左立柱：精密螺杆结构 (Extrusion Screw Left) -->
    <path d="M56,62 H78 V138 H56 Z" fill="url(#steelBlue)" />
    <!-- 左螺杆螺纹斜槽细节 -->
    <path d="M56,74 L78,66 M56,88 L78,80 M56,120 L78,112" stroke="#0D1824" stroke-width="3.5" />

    <!-- H字母右立柱：精密螺杆结构 (Extrusion Screw Right) -->
    <path d="M122,62 H144 V138 H122 Z" fill="url(#steelBlue)" />
    <!-- 右螺杆螺纹斜槽细节 -->
    <path d="M122,74 L144,66 M122,88 L144,80 M122,120 L144,112" stroke="#0D1824" stroke-width="3.5" />

    <!-- 顶部中央：精密挤出模头 (Extrusion Die / Nozzle) -->
    <polygon points="86,44 114,44 110,66 104,76 96,76 90,66" fill="url(#nozzleGrad)" />
    <rect x="92" y="38" width="16" height="5" rx="1.5" fill="url(#metalLight)" />

    <!-- 核心视觉：3D打印耗材连续精准挤出流道 (形成H中梁与丝材动态闭环) -->
    <!-- 丝材底层阴影切口 -->
    <path d="M46,104 C68,104 75,92 100,92 C125,92 132,104 154,104" fill="none" stroke="#09131C" stroke-width="16" stroke-linecap="round" />
    <!-- 垂直挤出丝流（从模头到中心） -->
    <line x1="100" y1="74" x2="100" y2="128" stroke="url(#nozzleGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- 横向高精度成型丝材（S型闭环流线） -->
    <path d="M46,104 C70,104 76,88 100,88 C124,88 130,104 154,104" fill="none" stroke="url(#filamentGrad)" stroke-width="9" stroke-linecap="round" />
    <!-- 丝材表面高光（体现高圆度与表面光洁度） -->
    <path d="M48,102 C70,102 76,86 100,86 C124,86 130,102 152,102" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

    <!-- 底部牵引测径校准环 (Laser Diameter Gauge Symbol) -->
    <circle cx="100" cy="134" r="7" fill="#0D1824" stroke="#00D2FF" stroke-width="2.5" />
    <circle cx="100" cy="134" r="2.5" fill="#FF6B00" />
  </g>

  <!-- 3. 右侧品牌主字标：HANMAIS（全纯矢量路径绘制，零字体依赖） -->
  <g fill="url(#metalLight)" filter="url(#dropShadow)">
    <!-- H -->
    <path d="M225,54 H237 V75 H257 V54 H269 V108 H257 V86 H237 V108 H225 Z" />
    <!-- A (带工业斜切顶角与熔体橙内芯横梁) -->
    <path d="M295,54 H309 L326,108 H313 L309,95 H295 L291,108 H278 Z M302,66 L297.5,84 H306.5 Z" fill-rule="evenodd" />
    <!-- N -->
    <path d="M336,54 H348 L370,88 V54 H382 V108 H370 L348,74 V108 H336 Z" />
    <!-- M -->
    <path d="M396,54 H409 L425,82 L441,54 H454 V108 H442 V74 L428,98 H422 L408,74 V108 H396 Z" />
    <!-- A -->
    <path d="M480,54 H494 L511,108 H498 L494,95 H480 L476,108 H463 Z M487,66 L482.5,84 H491.5 Z" fill-rule="evenodd" />
    <!-- I (上方融入高分子橙色精密导块) -->
    <path d="M522,68 H534 V108 H522 Z" />
    <polygon points="522,54 534,54 534,63 522,65" fill="url(#nozzleGrad)" />
    <!-- S (工业八角倒角造型) -->
    <path d="M554,54 H588 V64 H558 L556,66 V74 L558,76 H581 L590,85 V99 L581,108 H545 V98 H578 L580,96 V88 L578,86 H554 L545,77 V63 Z" />
  </g>

  <!-- 4. 副标题与行业定位标识 -->
  <!-- 精密丝材分割线（带卡尺刻度节点） -->
  <g transform="translate(225, 122)">
    <line x1="0" y1="0" x2="365" y2="0" stroke="url(#filamentGrad)" stroke-width="2.5" />
    <rect x="0" y="-4" width="3" height="8" fill="#FF6B00" />
    <rect x="182" y="-3" width="2" height="6" fill="#FF8800" />
    <rect x="363" y="-4" width="3" height="8" fill="#00D2FF" />
  </g>

  <!-- MACHINERY 副主标 -->
  <text x="225" y="146" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="8.5" fill="#388BFF">
    MACHINERY CO., LTD.
  </text>

  <!-- 核心业务说明小字 -->
  <text x="225" y="166" font-family="&#39;Segoe UI&#39;, &#39;Roboto&#39;, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif" font-size="10.5" font-weight="500" letter-spacing="1.8" fill="#7C97B3">
    3D PRINTING FILAMENT EXTRUSION EQUIPMENT
  </text>
</svg>